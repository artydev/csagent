<!DOCTYPE html>
<html>
<body>
    <h1>CsAgent UI</h1>

    <input type="text" id="prompt" placeholder="Ask something..." />
    <button onclick="send()">Send</button>

    <div id="log"></div>

    <script>
        async function send() {
            const prompt = document.getElementById("prompt").value;
            const log = document.getElementById("log");

            // Clear previous output (optional)
            log.innerHTML = "";

            const source = new EventSource(
                "/api/chat?prompt=" + encodeURIComponent(prompt)
            );

            source.onmessage = (e) => {
                const message = JSON.parse(e.data);

                log.innerHTML += `
                        <div>
                            ${message.type}: ${JSON.stringify(message.data)}
                        </div>
                    `;

                if (message.type === "done") {
                    source.close();
                }
            };

            source.onerror = (err) => {
                console.error("SSE error:", err);
                log.innerHTML += `<div style="color:red;">Connection error.</div>`;
                source.close();
            };
        }
    </script>
</body>
</html>
