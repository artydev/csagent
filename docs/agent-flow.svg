<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b2f"/></linearGradient>
  <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
  <linearGradient id="llm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18b6a4"/><stop offset="1" stop-color="#38d39f"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8ea0c8"/></marker>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font-size:30px;font-weight:700;fill:#f5f7ff}.sub{font-size:15px;fill:#aeb9d5}.label{font-size:16px;font-weight:650;fill:#f5f7ff}.small{font-size:13px;fill:#b9c4df}.tiny{font-size:12px;fill:#98a7c8}</style>
</defs>
<rect width="1200" height="820" rx="24" fill="url(#bg)"/>
<text x="60" y="62" class="title">CsAgent — Flux d’exécution</text>
<text x="60" y="90" class="sub">De l’interface utilisateur à la boucle LLM, aux outils et à la mémoire de conversation</text>

<!-- presentation -->
<rect x="55" y="130" width="1090" height="145" rx="20" fill="#11182b" stroke="#293552" stroke-width="1.5" filter="url(#shadow)"/>
<text x="80" y="158" class="label">1 · Présentation</text>
<rect x="80" y="180" width="300" height="70" rx="14" fill="#1b2741" stroke="#405274"/>
<text x="230" y="207" text-anchor="middle" class="label">CLI / TUI</text><text x="230" y="229" text-anchor="middle" class="small">ConsoleObserver</text>
<rect x="450" y="180" width="300" height="70" rx="14" fill="#1b2741" stroke="#405274"/>
<text x="600" y="207" text-anchor="middle" class="label">Web</text><text x="600" y="229" text-anchor="middle" class="small">ASP.NET + SSE</text>
<rect x="820" y="180" width="300" height="70" rx="14" fill="#1b2741" stroke="#405274"/>
<text x="970" y="207" text-anchor="middle" class="label">Desktop</text><text x="970" y="229" text-anchor="middle" class="small">Fenêtre native</text>

<!-- arrows -->
<path d="M230 250 V315 H600" fill="none" stroke="#8ea0c8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 250 V315" fill="none" stroke="#8ea0c8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M970 250 V315 H600" fill="none" stroke="#8ea0c8" stroke-width="2" marker-end="url(#arrow)"/>

<!-- agent -->
<rect x="330" y="330" width="540" height="125" rx="22" fill="url(#agent)" filter="url(#shadow)"/>
<text x="600" y="370" text-anchor="middle" class="title">CodingAgent</text>
<text x="600" y="397" text-anchor="middle" class="sub" fill="#eef1ff">Boucle autonome · IAgentObserver</text>
<text x="600" y="425" text-anchor="middle" class="small">Prompt → LLM → tool calls → résultats → nouveau tour</text>

<!-- arrows from agent -->
<path d="M430 455 V500 H220 V550" fill="none" stroke="#8ea0c8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M600 455 V550" fill="none" stroke="#8ea0c8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M770 455 V500 H980 V550" fill="none" stroke="#8ea0c8" stroke-width="2" marker-end="url(#arrow)"/>

<!-- services -->
<rect x="70" y="565" width="300" height="150" rx="18" fill="#101d28" stroke="#2d665e" stroke-width="1.5"/>
<text x="220" y="600" text-anchor="middle" class="label">LlmClient</text>
<text x="220" y="625" text-anchor="middle" class="small">API compatible OpenAI</text>
<text x="220" y="652" text-anchor="middle" class="tiny">historique + définitions d’outils</text>
<text x="220" y="676" text-anchor="middle" class="tiny">→ réponse / tool_calls</text>
<rect x="450" y="565" width="300" height="150" rx="18" fill="#171d2c" stroke="#4b5b82" stroke-width="1.5"/>
<text x="600" y="600" text-anchor="middle" class="label">ToolDispatcher</text>
<text x="600" y="625" text-anchor="middle" class="small">Outils natifs</text>
<text x="600" y="652" text-anchor="middle" class="tiny">fichiers · recherche · shell</text>
<text x="600" y="676" text-anchor="middle" class="tiny">confirmation des actions destructives</text>
<rect x="830" y="565" width="300" height="150" rx="18" fill="#171d2c" stroke="#4b5b82" stroke-width="1.5"/>
<text x="980" y="600" text-anchor="middle" class="label">MemoryStore</text>
<text x="980" y="625" text-anchor="middle" class="small">Mémoire persistante</text>
<text x="980" y="652" text-anchor="middle" class="tiny">agent_memory.json</text>
<text x="980" y="676" text-anchor="middle" class="tiny">save + trim de l’historique</text>

<!-- tool loop -->
<path d="M450 640 H375" fill="none" stroke="#38d39f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750 640 H825" fill="none" stroke="#8ea0c8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M220 565 V520 H600 V455" fill="none" stroke="#38d39f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="390" y="510" class="tiny">résultat outil</text>
<text x="755" y="625" class="tiny">persistance</text>

<!-- optional MCP -->
<rect x="430" y="745" width="340" height="48" rx="14" fill="#15252a" stroke="#2d665e"/>
<text x="600" y="775" text-anchor="middle" class="small">MCP optionnel · outils distants fusionnés avec les outils natifs</text>
<path d="M600 715 V745" fill="none" stroke="#38d39f" stroke-width="2" marker-end="url(#arrow)"/>
</svg>