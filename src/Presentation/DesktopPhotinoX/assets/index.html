<body>
    <div class="container">
        <header>
            <div class="brand">
                <h2>
                    <span class="status-dot"></span>
                    <span>CSAgent</span>
                    <span class="version" id="version-label">DesktopX</span>
                </h2>
            </div>
            <div><h4>CSAgent DesktopX</h4></div>
            <div class="status">
                <span class="status-dot"></span>
                <span id="step-counter">Ready</span>
            </div>
        </header>
        <div id="log"></div>
        <div class="input-area">
            <input id="in" autocomplete="off"
                   placeholder="Ask CSAgent anything... (All destructive actions require approval)"
                   onkeypress="if(event.key==='Enter'){run();}">
        </div>
    </div>
