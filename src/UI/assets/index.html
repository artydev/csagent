<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSAgent Console</title>
    <link href="styles.css" rel="stylesheet" />

    <!-- Prism.js Dracula Theme -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-dracula.min.css" rel="stylesheet" />

    <!-- Prism.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <!-- Prism.js Autoloader for automatic language detection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <!-- Language support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <h2>
                    <span class="status-dot"></span>
                    CSAgent
                    <span class="version">CSAgent v0.2</span>
                </h2>
            </div>
            <div class="status">
                <span class="status-dot"></span>
                SYSTEM READY
            </div>
        </header>
        <div id="log"></div>
        <div class="input-area">
            <input id="in"
                   autocomplete="off"
                   placeholder="Ask CSAgent anything... (All destructive actions require approval)"
                   onkeypress="if(event.key==='Enter'){run();}">
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
